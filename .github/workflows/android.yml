# Builds the Android wrapper. Exists so that shipping never requires Android
# Studio on a local machine: push, wait, download the artifact from the run.
#
# Without signing secrets it still builds and uploads an UNSIGNED bundle plus a
# debug APK you can sideload — useful before a key exists. With them, it
# produces the signed .aab that Play accepts.
name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The keystore never exists in the repository. It arrives as a base64
      # secret, is written outside any tracked path's reach for the length of
      # the job, and the passwords stay in the environment.
      # `env.X` in a step condition reads job-level env, not this step's own,
      # so the first version of this check was always false and never restored
      # anything. `secrets` is readable from a step `if`; this is.
      - name: Restore signing key
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "signing key restored ($(stat -c%s android/app/release.keystore) bytes)"

      - name: Build release bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      # A sideloadable APK as well as the bundle, because an .aab cannot be
      # installed on a phone directly and the first thing worth doing is
      # playing it on a real device.
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # The secret is passed as an env var and only ever tested for emptiness.
      # Interpolating it into the script body with ${{ }} would paste its value
      # into the shell, which is how secrets end up in logs.
      - name: Say what came out
        env:
          SIGNED: ${{ secrets.KEYSTORE_PASSWORD != '' }}
        run: |
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          find android/app/build/outputs \( -name '*.aab' -o -name '*.apk' \) -print | while read -r f; do
            echo "- \`${f#android/app/build/outputs/}\` — $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$SIGNED" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The bundle is **unsigned** — no signing secrets are set. See \`android/README.md\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: island-defence-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
